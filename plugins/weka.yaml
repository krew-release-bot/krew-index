apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: weka
spec:
  version: "v0.4.0"
  homepage: https://github.com/weka/kubectl-weka
  shortDescription: "Manage WEKA deployments in Kubernetes"
  description: |
    Kubectl plugin for WEKA operator and cluster planning, deployment, management and maintenance (status, preflight, logs, instances, support bundles).

  platforms:
    - selector:
        matchLabels:
          os: linux
          arch: amd64
      uri: https://github.com/weka/kubectl-weka/releases/download/v0.4.0/kubectl-weka_v0.4.0_linux_amd64.tar.gz
      sha256: 1ef8b42fac05acd278d7005ac54e2319d71231dfefec017c2c24bfc3bfd4c225
      bin: "kubectl-weka"

    - selector:
        matchLabels:
          os: linux
          arch: arm64
      uri: https://github.com/weka/kubectl-weka/releases/download/v0.4.0/kubectl-weka_v0.4.0_linux_arm64.tar.gz
      sha256: 8ef77c5663f308ad882507b3c253f2ea92e4f3d3e712b46f5838e9897c43bd28
      bin: "kubectl-weka"

    - selector:
        matchLabels:
          os: darwin
          arch: amd64
      uri: https://github.com/weka/kubectl-weka/releases/download/v0.4.0/kubectl-weka_v0.4.0_darwin_amd64.tar.gz
      sha256: 5d39fc2da2cd62d77ff5f33c9351edba9bbaaef3dcf733ced33ef8630112ef3f
      bin: "kubectl-weka"

    - selector:
        matchLabels:
          os: darwin
          arch: arm64
      uri: https://github.com/weka/kubectl-weka/releases/download/v0.4.0/kubectl-weka_v0.4.0_darwin_arm64.tar.gz
      sha256: cdee2a2a2de1641a53399ef4100d38259efc629986f42d2fefe2a904b3e176cd
