    - selector:
        matchLabels:
          os: windows
          arch: amd64
      uri: https://github.com/weka/kubectl-weka/releases/download/v0.4.0/kubectl-weka_v0.4.0_windows_amd64.zip
      sha256: 0f9b707e327a49cd9cc0605b9702279bca185c23bf25b17a2f2857c040d7ced0
