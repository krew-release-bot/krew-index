apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: glance
spec:
  version: "v0.4.1"
  homepage: https://gitlab.com/davidxarnold/glance
  shortDescription: View cluster resource allocation and usage.
  description: |
    Glance is a kubectl plugin that displays cluster resource allocation and utilization.

    It allows you to quickly view:
    - Node resource allocation (CPU and memory)
    - Pod resource requests and limits
    - Cluster-wide totals
    - Cloud provider node information (optional)

    Features:
    - Multiple output formats (text, pretty, JSON, charts)
    - Human-readable and exact value display
    - Label and field selectors

    Usage:
      kubectl glance                    # Default view
      kubectl glance -o pretty          # Colored output
      kubectl glance -o json            # JSON format
      kubectl glance --selector tier=app # Filter by labels
      kubectl glance -c                 # Include cloud provider info
  caveats: |
    This plugin requires kubectl 1.12 or higher.
    For cloud provider information (--cloud-info), ensure proper cloud credentials are configured.
  platforms:
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://gitlab.com/api/v4/projects/9502011/packages/generic/kubectl-glance/0.4.1/kubectl-glance-0.4.1-darwin-amd64.tar.gz
    sha256: ad6dfd041798a20da598885264ff3b5caed53183b4a17e21a5890db599b1a5f7
    bin: kubectl-glance
    files:
    - from: "*"
      to: "."
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://gitlab.com/api/v4/projects/9502011/packages/generic/kubectl-glance/0.4.1/kubectl-glance-0.4.1-darwin-arm64.tar.gz
    sha256: a8bde106a1a23e1bfa8f18fe068c209b7c3bcf95be8d147600d6982c587b0064
    bin: kubectl-glance
    files:
    - from: "*"
      to: "."
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://gitlab.com/api/v4/projects/9502011/packages/generic/kubectl-glance/0.4.1/kubectl-glance-0.4.1-linux-amd64.tar.gz
    sha256: 78cfb3a1e3ef057ca50db4503f8a03a4134004b69e51280ea74950d7440b2201
    bin: kubectl-glance
    files:
    - from: "*"
      to: "."
  - selector:
      matchLabels:
