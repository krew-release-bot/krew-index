    uri: https://gitlab.com/api/v4/projects/9502011/packages/generic/kubectl-glance/0.4.1/kubectl-glance-0.4.1-linux-arm64.tar.gz
    sha256: 541a73b109434fb2ae270ce31a58bbef204abd0719a4cd9602f3a53e4a33627b
    bin: kubectl-glance
    files:
    - from: "*"
      to: "."
  - selector:
      matchLabels:
        os: windows
